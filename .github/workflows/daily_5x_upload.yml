name: Velocity Japanese - Daily Upload (X only)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download phrase history
        uses: actions/download-artifact@v4
        id: download-history
        continue-on-error: true
        with:
          name: phrase-history
          path: output/history/

      - name: Initialize history
        run: |
          mkdir -p output/history
          if [ ! -f "output/history/all_generated_phrases.json" ]; then
            echo '{"phrases": [], "last_updated": null}' > output/history/all_generated_phrases.json
          fi
          if [ ! -f "output/history/recent_categories.json" ]; then
            echo '{"date": null, "last_3_days": []}' > output/history/recent_categories.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-zenhei fonts-wqy-microhei fonts-noto-cjk fonts-noto-cjk-extra fonts-takao-gothic

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r upload/requirements.txt

      - name: Create .env from secrets
        run: |
          echo "POLLINATIONS_API_KEY=${{ secrets.POLLINATIONS_API_KEY }}" >> .env
          echo "AI_MODEL=openai/gpt-5.4-nano" >> .env
          echo "TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}" >> .env
          echo "TWITTER_API_SECRET=${{ secrets.TWITTER_API_SECRET }}" >> .env
          echo "TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_ACCESS_SECRET=${{ secrets.TWITTER_ACCESS_SECRET }}" >> .env
          echo "TIMEZONE_OFFSET_HOURS=-5" >> .env

      - name: Generate Japanese Learning Reel
        run: |
          python facebook_reels_automation.py

      - name: Upload to X (Twitter)
        run: |
          python upload_all_platforms.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-japanese-reel-${{ github.run_number }}
          path: |
            output/video/*/final_reel.mp4
            output/video/*/metadata.json
          retention-days: 7

      - name: Upload phrase history
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phrase-history
          path: |
            output/history/all_generated_phrases.json
            output/history/recent_categories.json
          retention-days: 90
          overwrite: true

      - name: Commit phrase history
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/history/all_generated_phrases.json output/history/recent_categories.json
          if ! git diff --staged --quiet; then
            git commit -m "Update phrase history - Run #${{ github.run_number }}"
            git pull --rebase
            git push
          fi
